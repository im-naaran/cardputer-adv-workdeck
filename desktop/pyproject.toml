[project]
name = "cardputer-adv-workdeck"
version = "0.1.0"
description = "macOS companion service for Cardputer ADV Workdeck"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "bleak>=3.0.2,<4",
]

[project.scripts]
adv-workdeck = "adv_helper.main:cli"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adv_helper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
